<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>クリサム 3Dマップビュワー（大塚・池袋周辺）</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* レイヤーパネル */
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,.92); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 12px 14px; min-width: 190px;
  }
  #panel h1 { font-size: 13px; margin: 0 0 8px; color: #333; }
  #panel label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 0; cursor: pointer; color: #444; }
  #panel .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #panel .hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.6; }

  /* 駅ラベル（CSS2D 注釈図方式: 3Dリーダー線 + ラベル）
     ラベルボックスの下端中央がアンカーポイント（オブジェクトトップ+4m）に来る */
  .st-label {
    position: relative; width: 0; height: 0;
    pointer-events: none; user-select: none;
  }
  .st-label .tag {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -100%);
    font-size: 11.5px; color: #fff; background: rgba(30,30,30,.78);
    padding: 1px 6px; border-radius: 8px; white-space: nowrap;
  }
  .st-label.cresome .tag { background: rgba(233,75,58,.92); font-weight: bold; font-size: 13px; }

  /* クリック情報ポップアップ */
  #popup {
    position: absolute; z-index: 20; display: none; max-width: 260px;
    background: rgba(255,255,255,.97); border-radius: 10px;
    box-shadow: 0 3px 14px rgba(0,0,0,.25); padding: 10px 12px; font-size: 12.5px; color: #333;
  }
  #popup h2 { margin: 0 0 4px; font-size: 14px; }
  #popup .line { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  #popup .swatch { width: 12px; height: 12px; border-radius: 3px; }

  #status { position: absolute; bottom: 8px; left: 12px; z-index: 10; font-size: 11px; color: rgba(0,0,0,.55); }
  #loading {
    position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: #ffffff; font-size: 14px; color: #456; transition: opacity .4s;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/build/three.module.js",
    "three/addons/": "./lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="panel">
  <h1>レイヤー表示切替</h1>
  <div id="layers"></div>
  <h1 id="routes-title" style="display:none">経路（駅→クリサム）</h1>
  <div id="routes"></div>
  <div class="hint">左ドラッグ: 視点回転 / A・D: 左右 / W/S: 前後 / R: 上昇 / F: 下降</div>
</div>

<div id="popup"></div>
<div id="status"></div>
<div id="loading">地図データを読み込み中…</div>

<script type="module" src="./viewer.js"></script>
</body>
</html>
